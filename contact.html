<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About & Contact - Web Kelfin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1 class="logo">Web Kelfin</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html" class="active">About & Contact</a></li>
            </ul>
            


            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round"></div>
                </label>
                <span id="mode-label">Mode Terang</span>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="about-section">
            <h2>Tentang Saya</h2>
            <p>Halo! Ini adalah halaman About & Contact Saya.</p>
        </section>

        <section class="contact-section">
            <h2>Form Kontak</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="namaInput">Nama:</label>
                    <input type="text" id="namaInput" placeholder="Masukkan Nama..." required>
                </div>
                <div class="form-group">
                    <label for="prodiInput">Program Studi:</label>
                    <input type="text" id="prodiInput" placeholder="Masukkan Program Studi..." required>
                </div>
                <button type="submit" class="btn">Tampilkan Info</button>
            </form>

            <div id="resultCard" class="result-card hidden">
                <h3>Data Pengguna:</h3>
                <p><strong>Nama:</strong>
                    <span id="displayName"></span></p>
                <p><strong>Prodi:</strong> 
                    <span id="displayProdi"></span></p> 
                  
                <a id="waButton" href="#" target="_blank" class="btn btn-wa">Chat Saya via WhatsApp</a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
